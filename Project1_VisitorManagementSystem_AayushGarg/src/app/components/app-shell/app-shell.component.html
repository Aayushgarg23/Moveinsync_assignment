<div class="min-h-screen flex flex-col font-sans text-gray-900 bg-transparent">
  <!-- Floating Header Navbar -->
  <div class="px-6 pt-6 shrink-0 relative z-20">
    <header class="h-[72px] bg-white rounded-[24px] shadow-[0_2px_12px_rgb(0,0,0,0.03)] border border-white/50 flex items-center justify-between px-6">
      
      <!-- Left: Logo -->
      <div class="flex items-center gap-2 select-none cursor-pointer group" [routerLink]="['/']">
        <svg class="w-8 h-8 text-black" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2L2 22h20L12 2zm0 4.5l6.5 13h-13L12 6.5z"/>
        </svg>
        <span class="text-[20px] font-bold tracking-tight text-gray-900 hidden sm:inline-block">VisitorManager</span>
      </div>

      <!-- Center: Links -->
      @if (!isMobile()) {
        <nav class="flex items-center gap-6 h-full absolute left-1/2 transform -translate-x-1/2">
          @for (item of navItems; track item.route) {
            <a [routerLink]="item.route" 
               class="relative h-full flex items-center text-[15px] font-medium transition-colors"
               [ngClass]="isActive(item.route) ? 'text-[#007AFF]' : 'text-gray-600 hover:text-black'">
               {{ item.label }}
               <!-- Active Indicator (bottom line) -->
               @if (isActive(item.route)) {
                 <div class="absolute bottom-0 left-0 right-0 h-[3px] bg-[#007AFF] rounded-t-full"></div>
               }
            </a>
          }
        </nav>
      }

      <!-- Right: Profile & Action -->
      <div class="flex items-center gap-4">
        <!-- Profile -->
        <div class="hidden md:flex items-center gap-3">
          <img src="https://i.pravatar.cc/100?img=5" class="w-10 h-10 rounded-full object-cover">
          <div class="flex flex-col">
            <span class="text-sm font-bold text-gray-900 leading-none mb-1">Sarah Jenkins</span>
            <span class="text-[11px] text-gray-500 font-medium leading-none">HR Director</span>
          </div>
        </div>
        <!-- Check-in Button -->
        <button mat-flat-button [routerLink]="['/register/walk-in']" class="!bg-[#007AFF] !text-white !rounded-xl !px-5 !py-2 !h-10 text-[14px] font-semibold tracking-wide hover:!bg-blue-600 shadow-sm transition-colors">
          Check-In New
        </button>
      </div>

    </header>
  </div>

  <!-- Main Content Area -->
  <main class="flex-1 w-full max-w-[1500px] mx-auto pt-6 px-6 pb-12">
    <router-outlet></router-outlet>
  </main>
</div>
