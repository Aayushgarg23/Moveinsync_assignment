<mat-sidenav-container class="h-screen bg-gray-50">
  
  <mat-sidenav #sidenav 
               [mode]="isMobile() ? 'over' : 'side'" 
               [opened]="!isMobile()"
               class="w-64 bg-slate-900 text-white flex flex-col border-r-0 shadow-lg">
    
    <div class="h-16 flex items-center px-4 bg-slate-950 border-b border-slate-800">
      <mat-icon class="text-indigo-400 mr-2" style="font-size: 28px; width: 28px; height: 28px;">security</mat-icon>
      <span class="text-xl font-semibold tracking-wide text-white">MoveInSync VMS</span>
    </div>

    <mat-nav-list class="pt-4 px-2" style="padding-top: 1rem;">
      @for (item of navItems; track item.route) {
        <a mat-list-item 
           [routerLink]="item.route" 
           routerLinkActive="bg-slate-700 text-white rounded-lg" 
           class="mb-1 !text-slate-300 hover:!text-white hover:bg-slate-800 rounded-lg transition-colors duration-200"
           (click)="closeSidenavIfMobile()">
          <div class="flex items-center">
            <mat-icon class="mr-3">{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </div>
        </a>
      }
    </mat-nav-list>

  </mat-sidenav>

  <mat-sidenav-content class="flex flex-col h-full overflow-hidden">
    <mat-toolbar class="h-16 bg-white border-b border-gray-200 shrink-0">
      @if (isMobile()) {
        <button mat-icon-button (click)="sidenav.toggle()" aria-label="Toggle sidenav" class="mr-2 text-gray-600">
          <mat-icon>menu</mat-icon>
        </button>
      }
      
      <div class="flex-1"></div>
      
      <button mat-icon-button aria-label="Notifications" class="text-gray-500">
        <mat-icon>notifications</mat-icon>
      </button>
    </mat-toolbar>

    <main class="flex-1 overflow-auto p-4 md:p-8">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>

</mat-sidenav-container>
