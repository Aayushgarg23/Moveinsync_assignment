<div class="min-h-screen bg-slate-50/50 flex flex-col font-sans">
  <!-- Header Navbar -->
  <header class="h-16 bg-white/95 backdrop-blur-md border-b border-slate-200/60 shadow-[0_1px_3px_rgba(0,0,0,0.02)] flex items-center justify-between px-4 md:px-6 lg:px-8 shrink-0 relative z-20">
    
    <!-- Left: Logo & Mobile Hamburger -->
    <div class="flex items-center gap-4">
      <!-- Mobile Menu Hamburger - ONLY visible on mobile -->
      @if (isMobile()) {
        <button mat-icon-button [matMenuTriggerFor]="mobileMenu" class="text-slate-600 hover:bg-slate-100 transition-colors">
          <mat-icon>menu</mat-icon>
        </button>
      }

      <!-- Logo -->
      <div class="flex items-center gap-2.5 select-none cursor-pointer" [routerLink]="['/']">
        <!-- Minimal Geometric Badge (Indigo-600) -->
        <svg class="w-7 h-7 text-indigo-600 drop-shadow-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="currentColor" fill-opacity="0.1" />
          <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2.5" />
        </svg>
        <span class="text-[22px] font-bold tracking-tight text-slate-900 hidden sm:inline-block">MoveInSync</span>
      </div>
    </div>

    <!-- Center/Left-of-center: Desktop Nav Links - ONLY visible on desktop -->
    @if (!isMobile()) {
      <nav class="flex items-center h-full gap-2 absolute left-1/2 transform -translate-x-1/2">
        @for (item of navItems; track item.route) {
          <a [routerLink]="item.route" 
             class="relative h-9 px-4 rounded-full flex items-center text-sm font-semibold transition-all duration-200"
             [ngClass]="isActive(item.route) ? 'bg-indigo-50 text-indigo-700 shadow-[inset_0_1px_2px_rgba(0,0,0,0.04)]' : 'text-slate-500 hover:text-slate-900 hover:bg-slate-100/80'">
            {{ item.label }}
          </a>
        }
      </nav>
    }

    <!-- Right: Notifications & Profile placeholder -->
    <div class="flex items-center gap-3">
      <button mat-icon-button [matMenuTriggerFor]="notifMenu" class="text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 transition-colors">
        <mat-icon>notifications</mat-icon>
      </button>
      <!-- Optional Premium Avatar Placeholder -->
      <div class="hidden sm:flex w-9 h-9 rounded-full bg-slate-100 border border-slate-200 items-center justify-center text-sm font-bold text-slate-600 cursor-pointer hover:shadow-md transition-shadow">
        AG
      </div>
    </div>

  </header>

  <!-- Main Content Area -->
  <main class="flex-1 w-full max-w-[1600px] mx-auto">
    <router-outlet></router-outlet>
  </main>
</div>

<!-- Mobile Dropdown Menu -->
<mat-menu #mobileMenu="matMenu" class="min-w-[240px]">
  @for (item of navItems; track item.route) {
    <a mat-menu-item [routerLink]="item.route" [ngClass]="isActive(item.route) ? 'text-indigo-600 font-medium bg-indigo-50/50' : 'text-gray-700'">
      <mat-icon [ngClass]="isActive(item.route) ? 'text-indigo-600' : 'text-gray-500'">{{ item.icon }}</mat-icon>
      <span>{{ item.label }}</span>
    </a>
  }
</mat-menu>

<!-- Notifications Dropdown Menu -->
<mat-menu #notifMenu="matMenu" yPosition="below" class="w-72 mt-2 rounded-xl">
  <div class="p-6 flex flex-col items-center justify-center text-center outline-none">
    <div class="w-12 h-12 rounded-full bg-gray-50 flex items-center justify-center mb-3 border border-gray-100">
      <mat-icon class="text-gray-400">notifications_off</mat-icon>
    </div>
    <h3 class="text-sm font-semibold text-gray-800 mb-1">No new notifications</h3>
    <p class="text-xs text-gray-500">You're all caught up! Real-time alerts will appear here.</p>
  </div>
</mat-menu>
