<div class="min-h-screen bg-gray-50 flex flex-col font-sans">
  <!-- Header Navbar -->
  <header class="h-16 bg-white border-b border-gray-200 shadow-sm flex items-center justify-between px-4 md:px-6 lg:px-8 shrink-0 relative z-20">
    
    <!-- Left: Logo & Mobile Hamburger -->
    <div class="flex items-center gap-4">
      <!-- Mobile Menu Hamburger -->
      <button mat-icon-button [matMenuTriggerFor]="mobileMenu" class="md:hidden text-gray-600">
        <mat-icon>menu</mat-icon>
      </button>

      <!-- Logo -->
      <div class="flex items-center gap-2 select-none">
        <!-- Minimal Geometric Badge (Indigo-600) -->
        <svg class="w-7 h-7 text-indigo-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="currentColor" fill-opacity="0.1" />
          <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2.5" />
        </svg>
        <span class="text-xl font-bold tracking-tight text-gray-900 hidden sm:inline-block">MoveInSync</span>
      </div>
    </div>

    <!-- Center/Left-of-center: Desktop Nav Links -->
    <nav class="hidden md:flex items-center h-full gap-1 lg:gap-2 absolute left-1/2 transform -translate-x-1/2">
      @for (item of navItems; track item.route) {
        <a [routerLink]="item.route" 
           class="relative h-full flex items-center px-3 lg:px-4 text-sm font-medium transition-colors"
           [ngClass]="isActive(item.route) ? 'text-indigo-600' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-50'">
          {{ item.label }}
          <!-- Active Pill Indicator -->
          <span class="absolute bottom-0 left-0 w-full h-1 rounded-t-md transition-all duration-300"
                [ngClass]="isActive(item.route) ? 'bg-indigo-600' : 'bg-transparent'"></span>
        </a>
      }
    </nav>

    <!-- Right: Notifications & Profile placeholder -->
    <div class="flex items-center gap-2">
      <button mat-icon-button [matMenuTriggerFor]="notifMenu" class="text-gray-500 hover:text-indigo-600 transition-colors">
        <mat-icon>notifications</mat-icon>
      </button>
    </div>

  </header>

  <!-- Main Content Area -->
  <main class="flex-1 w-full max-w-[1600px] mx-auto">
    <router-outlet></router-outlet>
  </main>
</div>

<!-- Mobile Dropdown Menu -->
<mat-menu #mobileMenu="matMenu" class="min-w-[240px]">
  @for (item of navItems; track item.route) {
    <a mat-menu-item [routerLink]="item.route" [ngClass]="isActive(item.route) ? 'text-indigo-600 font-medium bg-indigo-50/50' : 'text-gray-700'">
      <mat-icon [ngClass]="isActive(item.route) ? 'text-indigo-600' : 'text-gray-500'">{{ item.icon }}</mat-icon>
      <span>{{ item.label }}</span>
    </a>
  }
</mat-menu>

<!-- Notifications Dropdown Menu -->
<mat-menu #notifMenu="matMenu" yPosition="below" class="w-72 mt-2 rounded-xl">
  <div class="p-6 flex flex-col items-center justify-center text-center outline-none">
    <div class="w-12 h-12 rounded-full bg-gray-50 flex items-center justify-center mb-3 border border-gray-100">
      <mat-icon class="text-gray-400">notifications_off</mat-icon>
    </div>
    <h3 class="text-sm font-semibold text-gray-800 mb-1">No new notifications</h3>
    <p class="text-xs text-gray-500">You're all caught up! Real-time alerts will appear here.</p>
  </div>
</mat-menu>
